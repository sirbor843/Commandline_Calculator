name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euxo pipefail

          # If a Makefile exists, prefer it.
          if [ -f Makefile ] || [ -f makefile ] || [ -f GNUmakefile ]; then
            make clean
            make
            exit 0
          fi

          # Otherwise, compile all C sources we can find.
          mkdir -p build
          mapfile -t c_files < <(find . -type f -name "*.c" -not -path "./build/*")

          if [ "${#c_files[@]}" -eq 0 ]; then
            echo "No .c files found and no Makefile present. Update the workflow to match your project structure." >&2
            exit 1
          fi

          gcc -Wall -Wextra -Werror -O2 -I. -o build/calculator "${c_files[@]}" -lm

      - name: Smoke test
        run: |
          set -euxo pipefail
          if [ -f ./calculator ]; then
            EXECUTABLE="./calculator"
          elif [ -f ./build/calculator ]; then
            EXECUTABLE="./build/calculator"
          else
            echo "Calculator executable not found."
            exit 1
          fi
          
          echo "Testing 'help' command..."
          echo "help" | "$EXECUTABLE"
          
          echo "Testing 'basic add 5 3'..."
          RESULT=$(echo "basic add 5 3" | "$EXECUTABLE" | grep "8.00" || true)
          if [ -z "$RESULT" ]; then
            echo "Basic calculation failed!"
            exit 1
          fi
          echo "Smoke test passed!"

      - name: CLI Regression Tests
        run: |
          set -euxo pipefail
          ./tests/run_tests.sh
